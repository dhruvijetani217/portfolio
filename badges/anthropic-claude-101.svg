    <g transform="translate(0, 4) scale(1.15)">
<path fill="#E07A5F" d="M4.5 24L13.8 4h3.6L26.7 24h-4.3l-2.4-5.6h-9.8L7.8 24H4.5zm7.3-9h7l-3.5-8.2-3.5 8.2z"/>
<path fill="#E07A5F" opacity="0.6" d="M23 7h3v17h-3z"/>
</g>
    <!-- Verified Badge -->
