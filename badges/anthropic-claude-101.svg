      <stop offset="0%" stop-color="#140F0D"/>
      <stop offset="100%" stop-color="#241814"/>
    </linearGradient>
    <radialGradient id="glow-anthropic-claude-101" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#E07A5F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E07A5F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-anthropic-claude-101" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="720" height="440" rx="20" fill="url(#bg-anthropic-claude-101)"/>
