  <line x1="44" y1="286" x2="676" y2="286" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Bottom Details - strictly NO DATE -->
  <g transform="translate(44, 335)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#6E827D" letter-spacing="1">CREDENTIAL</text>
    <text x="0" y="22" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Professional Certificate</text>
  </g>

  <g transform="translate(280, 335)">
